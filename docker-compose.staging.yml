services:
  mongodb-staging:
    image: mongo:7.0
    container_name: ssk-mongodb-staging
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ssk_staging_db
    ports:
      - "27018:27017"
    volumes:
      - staging_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssk-backend-staging
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    ports:
      - "8001:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      mongodb-staging:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssk-frontend-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  staging_mongo_data:
