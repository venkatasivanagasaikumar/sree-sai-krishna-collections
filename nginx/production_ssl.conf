# ==============================================================================
# SREE SAI KRISHNA COLLECTIONS (SSK)
# PRODUCTION NGINX REVERSE PROXY & HTTPS CONFIGURATION
# ==============================================================================

# HTTP to HTTPS Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name sreesaikrishnacollections.com www.sreesaikrishnacollections.com admin.sreesaikrishnacollections.com;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sreesaikrishnacollections.com www.sreesaikrishnacollections.com admin.sreesaikrishnacollections.com;

    # SSL Certificates (Automated via Certbot Let's Encrypt or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/sreesaikrishnacollections.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sreesaikrishnacollections.com/privkey.pem;

    # Modern TLS Parameters (Mozilla Intermediate Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Maximum Request Payload Size (Supports high-resolution jewellery image uploads)
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Modern Security Headers (OWASP, PCI-DSS, HSTS, CSP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://checkout.razorpay.com')" always;
    
    # Content Security Policy (Fully compatible with Razorpay, Google Fonts, Unsplash CDN)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://*.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com; object-src 'none'; base-uri 'self';" always;

    # React Single Page Application (Static Frontend Bundle)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-term Caching (30 Days with immutable hash)
    location ~* \.(?:css|js|woff2?|svg|ttf|otf|eot|ico|png|jpe?g|webp|gif)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Gateway Reverse Proxy (FastAPI Uvicorn Backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Product Media Uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health & Readiness Probes
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }
}
