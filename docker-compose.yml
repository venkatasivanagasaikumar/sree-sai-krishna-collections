version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ssk-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ssk_collections_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssk-backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - DATABASE_NAME=${DATABASE_NAME:-ssk_collections_db}
      - FORCE_MOCK_DB=${FORCE_MOCK_DB:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
