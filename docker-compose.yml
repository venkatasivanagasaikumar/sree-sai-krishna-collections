version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ssk-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ssk_collections_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssk-backend
    restart: always
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=ssk_collections_db
      - FORCE_MOCK_DB=false
      - SECRET_KEY=ssk-royal-navy-gold-super-secure-jwt-secret-key-2026-prod
      - RAZORPAY_KEY_ID=rzp_test_SSKJewelleryDemo2026
      - RAZORPAY_KEY_SECRET=SSKTestSecretMockSignatureKey
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssk-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
